
services:
  backend:
    container_name: quantum-backend
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: >
      sh -c "python manage.py migrate && 
             python manage.py collectstatic --noinput && 
             gunicorn project.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - /srv/data/quantum/media:/app/media
      - /srv/data/quantum/static:/app/static
    environment:
      - DB_NAME=${DB_NAME:-quantum_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Pg_8S7vZx2mKq41uB6rT}
      - DB_HOST=shared_postgres
      - DB_PORT=5432
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
    ports:
      - "8000:8000"
    networks:
      - shared_db

  quantum-uz:
    build:
      context: ./frontends/quantum-uz
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://62.72.32.37:8000}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://62.72.32.37:8000}
      - NODE_ENV=production
    networks:
      - shared_db

  ket-website:
    build:
      context: ./frontends/ket-website
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://62.72.32.37:8000}
    restart: always
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://62.72.32.37:8000}
      - NODE_ENV=production
    networks:
      - shared_db

  ket-studio:
    build:
      context: ./frontends/ket-studio
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3005:3000"
    networks:
      - shared_db

networks:
  shared_db:
    external: true
